<html>
	<head>
		<center><h1>A Light Bulb</h1></center>
		<!-- define your title  -->
	</head>


	<body>
		<!-- the description sentence  -->
		<center><h2>A program to turn off and on the lightbulb</h2></center>
		<!-- finsh the src attribute. To adjust the size of the image, you can modify  width="300px" height="400px" -->
		<center><img id='pic_bulboff.png' alt='bulb off' width="300px" height="400px" src="../static/pic_bulboff.png"></center>
		
		<!-- to modify the position and size of the buttons, you can modify  style="position:relative;top:5%;left:30%" 
		and style="font-size:30;height:100px; width:200px;" -->
		<div  style="position:relative;top:5%;left:34%">
	      <input style="font-size:30;height:100px; width:200px;" type = "button" id = "turn_on" value = "Turn ON" />
	      <input style="font-size:30;height:100px; width:200px;" type = "button" id = "turn_off" value = "Turn OFF" />
    	</div>




	</body>
</html>
